name: Build ROCKET Archiver (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure 7z.exe in bin
        shell: pwsh
        run: |
          if (-not (Test-Path "bin/7z.exe")) {
            New-Item -ItemType Directory -Force -Path bin | Out-Null
            Copy-Item "C:\Program Files\7-Zip\7z.exe" -Destination "bin/7z.exe"
          }

      - name: Build exe
        run: pyinstaller --clean ROCKET_Archiver.spec

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ROCKET_Archiver_v1.0.exe
          generate_release_notes: true

      - name: Upload build artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ROCKET_Archiver_v1.0.exe
          path: dist/ROCKET_Archiver_v1.0.exe
